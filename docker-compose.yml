services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cqrs_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker-compose.init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.2
    environment:
      # Menos ruido en logs (evita TRACE/INFO masivo de LeaderAndIsr y GroupCoordinator)
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  command-side:
    build:
      context: .
      dockerfile: Dockerfile.command
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cqrs_db}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-20}
      POSTGRES_MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTIONS:-5}
      POSTGRES_COMMAND_TIMEOUT: ${POSTGRES_COMMAND_TIMEOUT:-30}
      POSTGRES_EVENT_STORE_DB: ${POSTGRES_EVENT_STORE_DB:-cqrs_event_store}
      POSTGRES_EVENT_STORE_MAX_CONNECTIONS: ${POSTGRES_EVENT_STORE_MAX_CONNECTIONS:-10}
      POSTGRES_EVENT_STORE_MIN_CONNECTIONS: ${POSTGRES_EVENT_STORE_MIN_CONNECTIONS:-2}
      # En la red Compose el broker es siempre el servicio `kafka` (no uses localhost en .env para esto)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-anime-events}
      KAFKA_PRODUCER_RETRIES: ${KAFKA_PRODUCER_RETRIES:-3}
      KAFKA_PRODUCER_MAX_BLOCK_MS: ${KAFKA_PRODUCER_MAX_BLOCK_MS:-15000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  read-side:
    build:
      context: .
      dockerfile: Dockerfile.read
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cqrs_db}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-20}
      POSTGRES_MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTIONS:-5}
      POSTGRES_COMMAND_TIMEOUT: ${POSTGRES_COMMAND_TIMEOUT:-30}
      POSTGRES_EVENT_STORE_DB: ${POSTGRES_EVENT_STORE_DB:-cqrs_event_store}
      POSTGRES_EVENT_STORE_MAX_CONNECTIONS: ${POSTGRES_EVENT_STORE_MAX_CONNECTIONS:-10}
      POSTGRES_EVENT_STORE_MIN_CONNECTIONS: ${POSTGRES_EVENT_STORE_MIN_CONNECTIONS:-2}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-300}
      CACHE_STATS_ENABLED: ${CACHE_STATS_ENABLED:-true}
      PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cqrs_db}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-20}
      POSTGRES_MIN_CONNECTIONS: ${POSTGRES_MIN_CONNECTIONS:-5}
      POSTGRES_COMMAND_TIMEOUT: ${POSTGRES_COMMAND_TIMEOUT:-30}
      POSTGRES_EVENT_STORE_DB: ${POSTGRES_EVENT_STORE_DB:-cqrs_event_store}
      POSTGRES_EVENT_STORE_MAX_CONNECTIONS: ${POSTGRES_EVENT_STORE_MAX_CONNECTIONS:-10}
      POSTGRES_EVENT_STORE_MIN_CONNECTIONS: ${POSTGRES_EVENT_STORE_MIN_CONNECTIONS:-2}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_EVENTS: ${KAFKA_TOPIC_EVENTS:-anime-events}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-read-side-consumer-group}
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:-earliest}
      KAFKA_CONSUMER_ENABLE_AUTO_COMMIT: ${KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:-false}
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: ${KAFKA_CONSUMER_SESSION_TIMEOUT_MS:-30000}
      KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS: ${KAFKA_CONSUMER_HEARTBEAT_INTERVAL_MS:-3000}
      KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS: ${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:-300000}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      command-side:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-/graphql}
    ports:
      - "${CQRS_PUBLIC_PORT:-8081}:80"
    environment:
      PORT: 80
    depends_on:
      command-side:
        condition: service_healthy
      read-side:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
